# ~/.aria2/aria2.conf

# -----------------
# Basic Settings
# -----------------
# The default directory to save downloaded files
dir=${HOME}/Downloads

# Resume downloading a partially downloaded file
continue=true

# -----------------
# Connection & Download
# -----------------
# Maximum number of concurrent downloads
max-concurrent-downloads=5

# The maximum number of connections to one server for each download
max-connection-per-server=16

# Download a file using N connections (should match max-connection-per-server)
split=16

# Minimum size of a split. 
# Increased from 1M to 5M because splitting very small files causes unnecessary overhead.
min-split-size=5M

# -----------------
# Performance
# -----------------
# Preallocation method. 'falloc' is highly recommended for modern Linux filesystems (ext4, btrfs, xfs).
# It allocates space instantly, preventing fragmentation without the delay of writing zeros.
# 'none' can lead to heavy disk fragmentation over time.
file-allocation=falloc

# Enable disk cache. Helps reduce disk I/O and prevent disk bottlenecks on fast connections.
disk-cache=64M

# -----------------
# Other
# -----------------
# Retrieve timestamp of the remote file and apply it to the local file
remote-time=true
